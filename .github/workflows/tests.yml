name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check all Mesa V3 JavaScript
        run: |
          node --check static/v3/app.js
          node --check static/v3/studio.js
          node --check static/v3/compare.js
          node --check static/v3/workspace.js

  browser:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Install browser testing tools
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start real reservation API
        run: |
          DATABASE_PATH=/tmp/mesa-v4-browser.db python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/mesa-v4-api.log 2>&1 &
          echo $! > /tmp/mesa-v4-api.pid
          curl --retry 25 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:8765/health
      - name: Exercise desktop and mobile reservation journey
        run: npx playwright test tests/browser/mesa.spec.cjs --reporter=line --workers=1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-v4-browser-evidence
          path: |
            mesa-v4-desktop.png
            mesa-v4-mobile.png
            test-results/
            /tmp/mesa-v4-api.log
          if-no-files-found: ignore
